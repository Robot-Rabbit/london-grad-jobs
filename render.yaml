services:
  - name: london-grad-jobs
    type: web
    runtime: python
    region: frankfurt  # closest Render region to London
    plan: free         # free instances sleep after 15 min idle; switch to a paid plan to keep it awake
    buildCommand: pip install -r requirements.txt
    # One worker so the in-memory caches and rate limits are shared; threads handle concurrency.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: REED_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_LIMIT_PER_HOUR
        value: "40"
      - key: AI_DAILY_LIMIT
        value: "500"
