<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{{ title }} · London Grad Jobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>body{margin:0} .alert-page{max-width:520px;margin:12vh auto 0} .alert-page h1{font-size:30px;margin-bottom:10px} .alert-page form{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}</style>
</head>
<body>
<div class="wrap">
  <div class="panel alert-page">
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    {% if action %}
    <form method="post" action="{{ action }}">
      <input type="hidden" name="token" value="{{ token }}">
      <button class="btn primary" type="submit">{{ button }}</button>
      <a class="btn" href="/">Back to jobs</a>
    </form>
    {% else %}
    <p><a class="btn" href="/">Back to jobs</a></p>
    {% endif %}
  </div>
</div>
</body>
</html>
